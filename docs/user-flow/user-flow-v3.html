" marker-end=\"url(#arr)\"/><g id=\"f-url\" data-node=\"f-url\"><title>Получить временную ссылку. Внутри get_file_download сервер создаёт подписанную ссылку S3. Срок действия — 300 секунд. Отдельного нового вызова LMS нет.</title><rect x=\"1330\" y=\"825\" width=\"510\" height=\"280\" rx=\"18\" fill=\"#effbf8\" stroke=\"#76c5b5\" stroke-width=\"2\"/><text x=\"1353\" y=\"863\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"29\" font-weight=\"700\" fill=\"#17334b\" text-anchor=\"start\">Получить временную ссылку</text><text x=\"1353\" y=\"932\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">Внутри get_file_download сервер</text><text x=\"1353\" y=\"960.98\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">создаёт подписанную ссылку S3. Срок</text><text x=\"1353\" y=\"989.96\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">действия — 300 секунд. Отдельного</text><text x=\"1353\" y=\"1018.94\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">нового вызова LMS нет.</text></g><g id=\"f-download\" data-node=\"f-download\"><title>Скачать объект из S3. GET → S3 по полученной ссылке. Это обращение к хранилищу, а не ещё один эндпоинт LMS.</title><rect x=\"1960\" y=\"825\" width=\"530\" height=\"280\" rx=\"18\" fill=\"#f1f6fb\" stroke=\"#b4c6d5\" stroke-width=\"2\"/><text x=\"1983\" y=\"863\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"29\" font-weight=\"700\" fill=\"#17334b\" text-anchor=\"start\">Скачать объект из S3</text><text x=\"1983\" y=\"932\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">GET → S3 по полученной ссылке. Это</text><text x=\"1983\" y=\"960.98\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">обращение к хранилищу, а не ещё один</text><text x=\"1983\" y=\"989.96\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">эндпоинт LMS.</text></g><path d=\"M1140,965 L1330,965\" fill=\"none\" stroke=\"#8495a4\" stroke-width=\"3\" stroke-linejoin=\"round\" marker-end=\"url(#arr)\"/><text x=\"1230\" y=\"945\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"20\" font-weight=\"500\" fill=\"#617489\" text-anchor=\"middle\">Да</text><path d=\"M1840,965 L1960,965\" fill=\"none\" stroke=\"#8495a4\" stroke-width=\"3\" stroke-linejoin=\"round\" marker-end=\"url(#arr)\"/><g id=\"f-deny\" data-node=\"f-deny\"><title>Отказать в доступе. HTTP 403. Ссылка не выдаётся.</title><rect x=\"700\" y=\"1200\" width=\"560\" height=\"155\" rx=\"18\" fill=\"#fff4ef\" stroke=\"#d9957b\" stroke-width=\"2\"/><text x=\"723\" y=\"1238\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"29\" font-weight=\"700\" fill=\"#17334b\" text-anchor=\"start\">Отказать в доступе</text><text x=\"723\" y=\"1307\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"21\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">HTTP 403. Ссылка не выдаётся.</text></g><path d=\"M980,1075 L980,1200\" fill=\"none\" stroke=\"#8495a4\" stroke-width=\"3\" stroke-linejoin=\"round\" marker-end=\"url(#arr)\"/><text x=\"1040\" y=\"1145\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"20\" font-weight=\"500\" fill=\"#617489\" text-anchor=\"middle\">Нет</text><rect x=\"60\" y=\"1430\" width=\"2440\" height=\"125\" rx=\"14\" fill=\"#f1f6fb\" stroke=\"#c2d1dc\" stroke-width=\"2\"/><text x=\"90\" y=\"1473\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"27\" font-weight=\"700\" fill=\"#17334b\" text-anchor=\"start\">Дополнительные операции</text><text x=\"90\" y=\"1515\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"23\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">GET /get_file — метаданные. POST /upload_file — регистрация внешней HTTP-ссылки; этот запрос не загружает байты в S3.</text><text x=\"60\" y=\"1620\" font-family=\"Arial,DejaVu Sans,sans-serif\" font-size=\"20\" font-weight=\"400\" fill=\"#617489\" text-anchor=\"start\">API ветки endpoints · 25.10.2026 · S3 требует проверки на реальном хранилище</text></svg>"],nodes={"t-auth": {"id": "t-auth", "x": 70, "y": 245, "w": 450, "h": 260, "title": "Войти / зарегистрироваться", "apis": [["POST", "/auth"], ["POST", "/register"]], "note": "Регистрация — при первом входе."}, "t-home": {"id": "t-home", "x": 650, "y": 245, "w": 490, "h": 260, "title": "Главная страница", "apis": [["GET", "/get_courses"], ["GET", "/get_modules"]], "note": "При действующей сессии начинаем здесь. Отдельного dashboard нет."}, "t-open": {"id": "t-open", "x": 1270, "y": 245, "w": 650, "h": 260, "title": "Открыть модуль / курс", "apis": [["GET", "/get_module_data"], ["GET", "/get_course_data"]], "note": "Модуль открывается при необходимости; затем выбирается курс."}, "t-structure-create": {"id": "t-structure-create", "x": 270, "y": 625, "w": 620, "h": 300, "title": "Создать модуль или курс", "apis": [["POST", "/create_module"], ["POST", "/create_course"]], "note": "Альтернативы: выбирается нужный объект."}, "t-structure-read": {"id": "t-structure-read", "x": 1010, "y": 625, "w": 620, "h": 300, "title": "Получить данные перед правкой", "apis": [["GET", "/get_module_data"], ["GET", "/get_course_data"]], "note": "Открыть соответствующий объект. GET не изменяет его."}, "t-structure-edit": {"id": "t-structure-edit", "x": 1750, "y": 625, "w": 620, "h": 300, "title": "Сохранить изменения", "apis": [["PATCH", "/update_module"], ["PATCH", "/update_course"]], "note": "Для публикации курса: status=published. У модуля отдельного статуса публикации нет."}, "t-material-open": {"id": "t-material-open", "x": 270, "y": 1035, "w": 620, "h": 310, "title": "Открыть или создать материал", "apis": [["GET", "/get_materials"], ["GET", "/get_material_data"], ["POST", "/create_material"]], "note": "При создании черновика передать is_published=false."}, "t-material-edit": {"id": "t-material-edit", "x": 1010, "y": 1035, "w": 620, "h": 310, "title": "Изменить содержание", "apis": [["PATCH", "/update_material"]], "note": "Содержание и параметры материала. Вложения — по схеме 03 «Файлы и S3»."}, "t-material-publish": {"id": "t-material-publish", "x": 1750, "y": 1035, "w": 620, "h": 310, "title": "Опубликовать или скрыть", "apis": [["PATCH", "/update_material"]], "note": "is_published=true — опубликовать; false — скрыть. Чтение опубликованного: GET /get_materials."}, "t-assignment-open": {"id": "t-assignment-open", "x": 270, "y": 1445, "w": 620, "h": 310, "title": "Открыть или создать задание", "apis": [["GET", "/get_assignments"], ["GET", "/get_assignment_data"], ["POST", "/create_assignment"]], "note": "GET — список и детали; POST — создание. Черновик: is_published=false."}, "t-assignment-edit": {"id": "t-assignment-edit", "x": 1010, "y": 1445, "w": 620, "h": 310, "title": "Уточнить задание", "apis": [["PATCH", "/update_assignment"]], "note": "Описание, максимальный балл и due_date. Персональные назначения ещё не подключены к HTTP-запросу."}, "t-assignment-publish": {"id": "t-assignment-publish", "x": 1750, "y": 1445, "w": 620, "h": 310, "title": "Опубликовать или скрыть", "apis": [["PATCH", "/update_assignment"]], "note": "is_published=true / false. GET /get_assignments показывает доступные студенту задания."}, "t-members": {"id": "t-members", "x": 270, "y": 1855, "w": 620, "h": 260, "title": "Посмотреть участников", "apis": [["GET", "/get_members"]], "note": "Профили участников своего курса; также источник данных для раздела «Контакты»."}, "t-invite": {"id": "t-invite", "x": 1010, "y": 1855, "w": 620, "h": 260, "title": "Получить приглашение", "apis": [["POST", "/create_invitation"]], "note": "Код и ссылка курса. Копирование
