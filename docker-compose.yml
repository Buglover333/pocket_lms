services:
  postgres:
    image: postgres:16
    container_name: pocket-lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      # Внешний порт изменен на 5433 из-за конфликта с локально установленной службой PostgreSQL (занят порт 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/backend/db/schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pocket-lms-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  createbuckets:
    image: minio/mc:latest
    container_name: pocket-lms-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing myminio/pocket-lms-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
