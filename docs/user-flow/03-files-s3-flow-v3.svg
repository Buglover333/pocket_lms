<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1660" viewBox="0 0 2560 1660" role="img" aria-label="03  Файлы и S3 · общий сценарий"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8495a4"/></marker></defs><rect width="2560" height="1660" fill="#ffffff"/><rect width="2560" height="145" fill="#102b43"/><text x="60" y="66" font-family="Arial,DejaVu Sans,sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="start">03  Файлы и S3 · общий сценарий</text><text x="60" y="111" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#c7dbe8" text-anchor="start">Пользователь видит «прикрепить» и «скачать». Ниже — точные запросы интерфейса, сервера LMS и хранилища.</text><rect x="65" y="163" width="100" height="31" rx="7" fill="#1879b9" stroke="none" stroke-width="2"/><text x="115" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">GET</text><text x="179" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">чтение</text><rect x="395" y="163" width="100" height="31" rx="7" fill="#16866c" stroke="none" stroke-width="2"/><text x="445" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">POST</text><text x="509" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">отправка / создание</text><rect x="835" y="163" width="100" height="31" rx="7" fill="#b77713" stroke="none" stroke-width="2"/><text x="885" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">PATCH</text><text x="949" y="186" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">изменение</text><text x="270" y="285" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">01 · Загрузка файла</text><g id="f-init" data-node="f-init"><title>Подготовить загрузку в LMS. JSON: имя, тип, MIME и размер. Сервер возвращает file_id, upload_url и fields. Ключ S3 назначает сервер.</title><rect x="70" y="330" width="510" height="310" rx="18" fill="#effbf8" stroke="#76c5b5" stroke-width="2"/><text x="93" y="368" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Подготовить загрузку в LMS</text><rect x="90" y="418" width="470" height="35" rx="7" fill="#ffffff" stroke="#dce7e9" stroke-width="2"/><rect x="95" y="423" width="80" height="25" rx="5" fill="#16866c" stroke="none" stroke-width="2"/><text x="135.0" y="442" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">POST</text><text x="189" y="443" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#17334b" text-anchor="start">/create_file_upload</text><text x="93" y="480" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">JSON: имя, тип, MIME и размер. Сервер</text><text x="93" y="508.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">возвращает file_id, upload_url и</text><text x="93" y="537.96" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">fields. Ключ S3 назначает сервер.</text></g><g id="f-transfer" data-node="f-transfer"><title>Отправить файл в хранилище. POST → S3 напрямую. multipart/form-data: выданные fields + бинарный file. Это не эндпоинт LMS.</title><rect x="700" y="330" width="510" height="310" rx="18" fill="#f1f6fb" stroke="#b4c6d5" stroke-width="2"/><text x="723" y="368" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Отправить файл в хранилище</text><text x="723" y="437" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">POST → S3 напрямую.</text><text x="723" y="465.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">multipart/form-data: выданные fields +</text><text x="723" y="494.96000000000004" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">бинарный file. Это не эндпоинт LMS.</text></g><g id="f-confirm" data-node="f-confirm"><title>Подтвердить загрузку в LMS. file_id. Сервер проверяет объект через S3 HEAD: размер и MIME. Только затем файл становится ready.</title><rect x="1330" y="330" width="510" height="310" rx="18" fill="#effbf8" stroke="#76c5b5" stroke-width="2"/><text x="1353" y="368" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Подтвердить загрузку в LMS</text><rect x="1350" y="418" width="470" height="35" rx="7" fill="#ffffff" stroke="#dce7e9" stroke-width="2"/><rect x="1355" y="423" width="80" height="25" rx="5" fill="#16866c" stroke="none" stroke-width="2"/><text x="1395.0" y="442" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">POST</text><text x="1449" y="443" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#17334b" text-anchor="start">/complete_file_upload</text><text x="1353" y="480" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">file_id. Сервер проверяет объект через</text><text x="1353" y="508.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">S3 HEAD: размер и MIME. Только затем</text><text x="1353" y="537.96" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">файл становится ready.</text></g><g id="f-attach" data-node="f-attach"><title>Использовать готовый file_id. Для сдачи: file_ids в submit_work / resubmit_work. Для материала: lesson_id указывается при подготовке загрузки.</title><rect x="1960" y="330" width="530" height="310" rx="18" fill="#effbf8" stroke="#76c5b5" stroke-width="2"/><text x="1983" y="368" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Использовать готовый file_id</text><text x="1983" y="437" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">Для сдачи: file_ids в submit_work /</text><text x="1983" y="465.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">resubmit_work. Для материала: lesson_id</text><text x="1983" y="494.96000000000004" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">указывается при подготовке загрузки.</text></g><path d="M580,485 L700,485" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1210,485 L1330,485" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1840,485 L1960,485" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><text x="270" y="780" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">02 · Скачивание файла</text><g id="f-request" data-node="f-request"><title>Запросить доступ к файлу. file_id. Пользователь должен иметь доступ к материалу или сдаче, к которым относится файл.</title><rect x="70" y="825" width="540" height="280" rx="18" fill="#effbf8" stroke="#76c5b5" stroke-width="2"/><text x="93" y="863" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Запросить доступ к файлу</text><rect x="90" y="913" width="500" height="35" rx="7" fill="#ffffff" stroke="#dce7e9" stroke-width="2"/><rect x="95" y="918" width="80" height="25" rx="5" fill="#1879b9" stroke="none" stroke-width="2"/><text x="135.0" y="937" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">GET</text><text x="189" y="938" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#17334b" text-anchor="start">/get_file_download</text><text x="93" y="975" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">file_id. Пользователь должен иметь доступ</text><text x="93" y="1003.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">к материалу или сдаче, к которым</text><text x="93" y="1032.96" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">относится файл.</text></g><path d="M820.0,965 L980,855.0 L1140.0,965 L980,1075.0 Z" fill="#f3edff" stroke="#7655bd" stroke-width="3"/><text x="980" y="958" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#7655bd" text-anchor="middle">Доступ</text><text x="980" y="988" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#7655bd" text-anchor="middle">разрешён?</text><path d="M610,965 L820,965" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><g id="f-url" data-node="f-url"><title>Получить временную ссылку. Внутри get_file_download сервер создаёт подписанную ссылку S3. Срок действия — 300 секунд. Отдельного нового вызова LMS нет.</title><rect x="1330" y="825" width="510" height="280" rx="18" fill="#effbf8" stroke="#76c5b5" stroke-width="2"/><text x="1353" y="863" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Получить временную ссылку</text><text x="1353" y="932" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">Внутри get_file_download сервер</text><text x="1353" y="960.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">создаёт подписанную ссылку S3. Срок</text><text x="1353" y="989.96" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">действия — 300 секунд. Отдельного</text><text x="1353" y="1018.94" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">нового вызова LMS нет.</text></g><g id="f-download" data-node="f-download"><title>Скачать объект из S3. GET → S3 по полученной ссылке. Это обращение к хранилищу, а не ещё один эндпоинт LMS.</title><rect x="1960" y="825" width="530" height="280" rx="18" fill="#f1f6fb" stroke="#b4c6d5" stroke-width="2"/><text x="1983" y="863" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Скачать объект из S3</text><text x="1983" y="932" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">GET → S3 по полученной ссылке. Это</text><text x="1983" y="960.98" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">обращение к хранилищу, а не ещё один</text><text x="1983" y="989.96" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">эндпоинт LMS.</text></g><path d="M1140,965 L1330,965" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1230" y="945" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#617489" text-anchor="middle">Да</text><path d="M1840,965 L1960,965" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><g id="f-deny" data-node="f-deny"><title>Отказать в доступе. HTTP 403. Ссылка не выдаётся.</title><rect x="700" y="1200" width="560" height="155" rx="18" fill="#fff4ef" stroke="#d9957b" stroke-width="2"/><text x="723" y="1238" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#17334b" text-anchor="start">Отказать в доступе</text><text x="723" y="1307" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#617489" text-anchor="start">HTTP 403. Ссылка не выдаётся.</text></g><path d="M980,1075 L980,1200" fill="none" stroke="#8495a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1040" y="1145" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#617489" text-anchor="middle">Нет</text><rect x="60" y="1430" width="2440" height="125" rx="14" fill="#f1f6fb" stroke="#c2d1dc" stroke-width="2"/><text x="90" y="1473" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#17334b" text-anchor="start">Дополнительные операции</text><text x="90" y="1515" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#617489" text-anchor="start">GET /get_file — метаданные. POST /upload_file — регистрация внешней HTTP-ссылки; этот запрос не загружает байты в S3.</text><text x="60" y="1620" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#617489" text-anchor="start">API ветки endpoints · 25.10.2026 · S3 требует проверки на реальном хранилище</text></svg>